plugins {
	id 'application'
}

def lwjglVersion = '3.3.4'
def lwjglNatives = 'natives-macos-arm64'

dependencies {
	implementation project(':tools')

	implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
	['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl', 'lwjgl-openal', 'lwjgl-stb'].each { m ->
		implementation "org.lwjgl:$m"
		runtimeOnly "org.lwjgl:$m::$lwjglNatives"
	}
	implementation 'org.joml:joml:1.10.5'
}

application {
	mainClass = 'devple.gow.engine.GowMain'
	// macOS: GLFW 창은 메인 스레드(첫 스레드)에서만 생성 가능
	applicationDefaultJvmArgs = ['-XstartOnFirstThread']
}

run {
	workingDir = rootProject.projectDir
	if (project.hasProperty('gowDebug')) {
		systemProperty 'gow.debug', 'true'
	}
	if (project.hasProperty('gowScript')) {
		systemProperty 'gow.script', project.property('gowScript')
	}
	if (project.hasProperty('gowGiveAll')) {
		systemProperty 'gow.giveAll', 'true'
	}
	if (project.hasProperty('gowMagicStage')) {
		systemProperty 'gow.magicStage', project.property('gowMagicStage')   // 연습 씬 마법 단계 (40 문서)
	}
	if (project.hasProperty('gowFxLog')) {
		systemProperty 'gow.fxlog', 'true'   // 이펙트 GO 재생·해석 로그 (40 문서)
	}
	if (project.hasProperty('gowKeyLog')) {
		systemProperty 'gow.keylog', 'true'   // 키 입력 진단 로그 (창 포커스·누름/뗌)
	}
	if (project.hasProperty('gowUnlockAll')) {
		systemProperty 'gow.unlockAll', 'true'   // 귀중품(보너스) 메뉴 전부 해금 (39 문서)
	}
}

dependencies {
	testImplementation platform('org.junit:junit-bom:5.11.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	systemProperty 'gow.rom', "${rootProject.projectDir}/gow-rom"
	if (project.hasProperty('testShuffle')) {   // 순서 의존 점검: -PtestShuffle[=씨앗] 클래스·메서드 순서를 섞는다 (48 문서 §5)
		systemProperty 'junit.jupiter.testclass.order.default', 'org.junit.jupiter.api.ClassOrderer$Random'
		systemProperty 'junit.jupiter.testmethod.order.default', 'org.junit.jupiter.api.MethodOrderer$Random'
		def seed = project.property('testShuffle')
		if (seed) {
			systemProperty 'junit.jupiter.execution.order.random.seed', seed
		}
	}
	if (project.hasProperty('gowTestDraw')) {
		systemProperty 'gow.test.draw', 'true'   // 히트박스 그림 시트를 work/hitbox 에 (기본은 쓰지 않음, 48 문서)
	}
}
